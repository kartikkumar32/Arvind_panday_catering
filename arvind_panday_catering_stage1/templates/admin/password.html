{% extends "admin/base_admin.html" %}{% block title %}Change Password{% endblock %}{% block heading %}Change Password{% endblock %}
{% block content %}<div class="admin-panel form-panel-admin"><h2>Update administrator password</h2><p>Use a unique password with at least 12 characters.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Current password</label><input class="form-control" type="password" name="current_password" required autocomplete="current-password"></div><div class="mb-3"><label class="form-label">New password</label><input class="form-control" type="password" name="new_password" minlength="12" required autocomplete="new-password"></div><button class="btn btn-gold">Update Password</button></form></div>{% endblock %}
